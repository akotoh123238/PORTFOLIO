<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="eBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a14" />
      <stop offset="100%" stop-color="#181829" />
    </linearGradient>
    <linearGradient id="discGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
  </defs>

  <rect width="600" height="380" rx="12" fill="url(#eBg)"/>
  
  <!-- Browser top bar -->
  <rect width="600" height="36" fill="#181829" rx="12"/>
  <rect y="24" width="600" height="12" fill="#181829"/>
  <circle cx="20" cy="18" r="5" fill="#ef4444" />
  <circle cx="36" cy="18" r="5" fill="#f59e0b" />
  <circle cx="52" cy="18" r="5" fill="#10b981" />
  <rect x="80" y="8" width="280" height="20" rx="6" fill="#0f0f1c" />
  <text x="95" y="22" font-family="monospace" font-size="11" fill="#94a3b8">https://echo-soundwave.io</text>

  <!-- Player Main Layout -->
  <!-- Left Side: Spinning Vinyl / Album Art -->
  <g transform="translate(40, 60)">
    <!-- Vinyl Disc -->
    <circle cx="110" cy="120" r="100" fill="#111122" stroke="#33334d" stroke-width="2"/>
    <circle cx="110" cy="120" r="85" fill="none" stroke="#222238" stroke-width="1.5"/>
    <circle cx="110" cy="120" r="70" fill="none" stroke="#222238" stroke-width="1.5"/>
    <circle cx="110" cy="120" r="55" fill="none" stroke="#222238" stroke-width="1.5"/>
    <circle cx="110" cy="120" r="40" fill="url(#discGrad)"/>
    <circle cx="110" cy="120" r="10" fill="#0a0a14"/>
  </g>

  <!-- Right Side: Track details & Waveform Visualizer -->
  <g transform="translate(280, 70)">
    <rect x="0" y="0" width="80" height="22" rx="11" fill="#312e81"/>
    <text x="40" y="15" font-family="sans-serif" font-size="10" font-weight="bold" fill="#a5b4fc" text-anchor="middle">SYNTHWAVE</text>
    
    <text x="0" y="52" font-family="sans-serif" font-size="22" font-weight="bold" fill="#f8fafc">Neon Horizon</text>
    <text x="0" y="74" font-family="sans-serif" font-size="14" fill="#94a3b8">Kavinsky &amp; Stellardrone</text>

    <!-- Dynamic Audio Waveform Bars -->
    <g transform="translate(0, 95)">
      <!-- 24 Wave Bars -->
      <rect x="0" y="25" width="6" height="30" rx="3" fill="#6366f1"/>
      <rect x="11" y="15" width="6" height="50" rx="3" fill="#6366f1"/>
      <rect x="22" y="5" width="6" height="70" rx="3" fill="#818cf8"/>
      <rect x="33" y="20" width="6" height="40" rx="3" fill="#818cf8"/>
      <rect x="44" y="30" width="6" height="20" rx="3" fill="#a855f7"/>
      <rect x="55" y="10" width="6" height="60" rx="3" fill="#a855f7"/>
      <rect x="66" y="0" width="6" height="80" rx="3" fill="#c084fc"/>
      <rect x="77" y="15" width="6" height="50" rx="3" fill="#c084fc"/>
      <rect x="88" y="22" width="6" height="36" rx="3" fill="#e879f9"/>
      <rect x="99" y="8" width="6" height="64" rx="3" fill="#ec4899"/>
      <rect x="110" y="0" width="6" height="80" rx="3" fill="#f43f5e"/>
      <rect x="121" y="18" width="6" height="44" rx="3" fill="#ec4899"/>
      <rect x="132" y="25" width="6" height="30" rx="3" fill="#06b6d4"/>
      <rect x="143" y="12" width="6" height="56" rx="3" fill="#06b6d4"/>
      <rect x="154" y="5" width="6" height="70" rx="3" fill="#22d3ee"/>
      <rect x="165" y="20" width="6" height="40" rx="3" fill="#38bdf8"/>
      <rect x="176" y="28" width="6" height="24" rx="3" fill="#38bdf8"/>
      <rect x="187" y="10" width="6" height="60" rx="3" fill="#60a5fa"/>
      <rect x="198" y="2" width="6" height="76" rx="3" fill="#60a5fa"/>
      <rect x="209" y="18" width="6" height="44" rx="3" fill="#818cf8"/>
      <rect x="220" y="30" width="6" height="20" rx="3" fill="#334155"/>
      <rect x="231" y="24" width="6" height="32" rx="3" fill="#334155"/>
      <rect x="242" y="15" width="6" height="50" rx="3" fill="#334155"/>
      <rect x="253" y="28" width="6" height="24" rx="3" fill="#334155"/>
    </g>

    <text x="0" y="196" font-family="monospace" font-size="11" fill="#38bdf8">02:44</text>
    <text x="260" y="196" font-family="monospace" font-size="11" fill="#64748b" text-anchor="end">04:18</text>
  </g>

  <!-- Bottom Player Controls Bar -->
  <g transform="translate(40, 310)">
    <rect width="520" height="48" rx="24" fill="#151528" stroke="#2c2c4d" stroke-width="1"/>
    
    <!-- Shuffle & Prev -->
    <text x="180" y="30" font-family="sans-serif" font-size="16" fill="#94a3b8" text-anchor="middle">🔀</text>
    <text x="220" y="30" font-family="sans-serif" font-size="16" fill="#f8fafc" text-anchor="middle">⏮</text>
    
    <!-- Play/Pause Button Circle -->
    <circle cx="260" cy="24" r="18" fill="url(#discGrad)"/>
    <text x="260" y="30" font-family="sans-serif" font-size="16" fill="#fff" text-anchor="middle">⏸</text>

    <!-- Next & Repeat -->
    <text x="300" y="30" font-family="sans-serif" font-size="16" fill="#f8fafc" text-anchor="middle">⏭</text>
    <text x="340" y="30" font-family="sans-serif" font-size="16" fill="#94a3b8" text-anchor="middle">🔁</text>

    <!-- Volume Bar -->
    <text x="410" y="30" font-family="sans-serif" font-size="14" fill="#94a3b8">🔊</text>
    <rect x="435" y="22" width="60" height="4" rx="2" fill="#334155"/>
    <rect x="435" y="22" width="45" height="4" rx="2" fill="#06b6d4"/>
  </g>
</svg>
