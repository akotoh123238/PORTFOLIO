<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="nBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
  </defs>

  <!-- Window Frame -->
  <rect width="600" height="380" rx="12" fill="url(#nBg)"/>
  
  <!-- Browser top bar -->
  <rect width="600" height="36" fill="#1e293b" rx="12"/>
  <rect y="24" width="600" height="12" fill="#1e293b"/>
  <circle cx="20" cy="18" r="5" fill="#ef4444" />
  <circle cx="36" cy="18" r="5" fill="#f59e0b" />
  <circle cx="52" cy="18" r="5" fill="#10b981" />
  <!-- URL bar -->
  <rect x="80" y="8" width="280" height="20" rx="6" fill="#0f172a" />
  <text x="95" y="22" font-family="monospace" font-size="11" fill="#94a3b8">https://nexus-ai.platform.io</text>

  <!-- Left Sidebar -->
  <rect x="0" y="36" width="60" height="344" fill="#0f172a" opacity="0.8"/>
  <circle cx="30" cy="65" r="14" fill="#6366f1" />
  <text x="30" y="70" font-family="sans-serif" font-size="12" font-weight="bold" fill="#fff" text-anchor="middle">NX</text>
  <rect x="18" y="105" width="24" height="6" rx="3" fill="#6366f1"/>
  <rect x="18" y="130" width="24" height="6" rx="3" fill="#475569"/>
  <rect x="18" y="155" width="24" height="6" rx="3" fill="#475569"/>
  <rect x="18" y="180" width="24" height="6" rx="3" fill="#475569"/>

  <!-- Main Content Dashboard -->
  <!-- Top Stat Cards -->
  <g transform="translate(80, 52)">
    <rect width="115" height="60" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="14" y="22" font-family="sans-serif" font-size="11" fill="#94a3b8">Total Revenue</text>
    <text x="14" y="44" font-family="sans-serif" font-size="17" font-weight="bold" fill="#f8fafc">$128.4K</text>
    <text x="75" y="44" font-family="sans-serif" font-size="10" fill="#10b981">+24.5%</text>
  </g>
  <g transform="translate(210, 52)">
    <rect width="115" height="60" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="14" y="22" font-family="sans-serif" font-size="11" fill="#94a3b8">Active Users</text>
    <text x="14" y="44" font-family="sans-serif" font-size="17" font-weight="bold" fill="#f8fafc">42.8K</text>
    <text x="75" y="44" font-family="sans-serif" font-size="10" fill="#10b981">+18.2%</text>
  </g>
  <g transform="translate(340, 52)">
    <rect width="115" height="60" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="14" y="22" font-family="sans-serif" font-size="11" fill="#94a3b8">AI Query Speed</text>
    <text x="14" y="44" font-family="sans-serif" font-size="17" font-weight="bold" fill="#f8fafc">14ms</text>
    <text x="80" y="44" font-family="sans-serif" font-size="10" fill="#06b6d4">⚡ Fast</text>
  </g>
  <g transform="translate(470, 52)">
    <rect width="115" height="60" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="14" y="22" font-family="sans-serif" font-size="11" fill="#94a3b8">Model Accuracy</text>
    <text x="14" y="44" font-family="sans-serif" font-size="17" font-weight="bold" fill="#f8fafc">99.4%</text>
  </g>

  <!-- Large Chart Area -->
  <g transform="translate(80, 126)">
    <rect width="335" height="180" rx="8" fill="#111827" stroke="#334155" stroke-width="1"/>
    <text x="18" y="26" font-family="sans-serif" font-size="13" font-weight="bold" fill="#f8fafc">Real-Time Predictive Flow</text>
    <text x="250" y="26" font-family="sans-serif" font-size="11" fill="#6366f1">● Live Stream</text>
    
    <!-- Grid Lines -->
    <line x1="20" y1="60" x2="315" y2="60" stroke="#1f2937" stroke-width="1" />
    <line x1="20" y1="100" x2="315" y2="100" stroke="#1f2937" stroke-width="1" />
    <line x1="20" y1="140" x2="315" y2="140" stroke="#1f2937" stroke-width="1" />

    <!-- Chart Fill Area -->
    <path d="M20 150 Q70 120, 110 90 T190 100 T260 50 T315 40 L315 160 L20 160 Z" fill="url(#chartGrad)"/>
    <!-- Chart Stroke -->
    <path d="M20 150 Q70 120, 110 90 T190 100 T260 50 T315 40" fill="none" stroke="#6366f1" stroke-width="3"/>
    
    <!-- Pulse Point -->
    <circle cx="260" cy="50" r="4" fill="#a855f7" />
    <circle cx="315" cy="40" r="5" fill="#06b6d4" />
  </g>

  <!-- Right Side AI Insights Widget -->
  <g transform="translate(430, 126)">
    <rect width="155" height="180" rx="8" fill="#111827" stroke="#334155" stroke-width="1"/>
    <text x="14" y="26" font-family="sans-serif" font-size="12" font-weight="bold" fill="#f8fafc">Neural Insights</text>
    
    <!-- Mini insight boxes -->
    <rect x="14" y="42" width="127" height="36" rx="6" fill="#1e293b"/>
    <circle cx="28" cy="60" r="5" fill="#10b981"/>
    <rect x="42" y="52" width="75" height="5" rx="2.5" fill="#cbd5e1"/>
    <rect x="42" y="62" width="50" height="4" rx="2" fill="#64748b"/>

    <rect x="14" y="86" width="127" height="36" rx="6" fill="#1e293b"/>
    <circle cx="28" cy="104" r="5" fill="#6366f1"/>
    <rect x="42" y="96" width="80" height="5" rx="2.5" fill="#cbd5e1"/>
    <rect x="42" y="106" width="60" height="4" rx="2" fill="#64748b"/>

    <rect x="14" y="130" width="127" height="36" rx="6" fill="#1e293b"/>
    <circle cx="28" cy="148" r="5" fill="#06b6d4"/>
    <rect x="42" y="140" width="70" height="5" rx="2.5" fill="#cbd5e1"/>
    <rect x="42" y="150" width="45" height="4" rx="2" fill="#64748b"/>
  </g>

  <!-- Bottom Log Row -->
  <g transform="translate(80, 318)">
    <rect width="505" height="48" rx="8" fill="#111827" stroke="#334155" stroke-width="1"/>
    <text x="18" y="28" font-family="monospace" font-size="11" fill="#10b981">✓ System Healthy</text>
    <text x="160" y="28" font-family="monospace" font-size="11" fill="#94a3b8">99.98% Uptime</text>
    <text x="320" y="28" font-family="monospace" font-size="11" fill="#94a3b8">Cluster: US-East-1 (Primary)</text>
    <rect x="440" y="15" width="50" height="20" rx="4" fill="url(#cyanGrad)"/>
    <text x="465" y="29" font-family="sans-serif" font-size="10" font-weight="bold" fill="#fff" text-anchor="middle">SYNC</text>
  </g>
</svg>
