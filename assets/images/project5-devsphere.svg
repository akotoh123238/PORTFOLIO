<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="dGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1f2937" />
    </linearGradient>
  </defs>

  <rect width="600" height="380" rx="12" fill="url(#dGrad)"/>
  
  <!-- Browser top bar -->
  <rect width="600" height="36" fill="#1f2937" rx="12"/>
  <rect y="24" width="600" height="12" fill="#1f2937"/>
  <circle cx="20" cy="18" r="5" fill="#ef4444" />
  <circle cx="36" cy="18" r="5" fill="#f59e0b" />
  <circle cx="52" cy="18" r="5" fill="#10b981" />
  <rect x="80" y="8" width="280" height="20" rx="6" fill="#111827" />
  <text x="95" y="22" font-family="monospace" font-size="11" fill="#94a3b8">https://devsphere.community/articles</text>

  <!-- Community Hero Header -->
  <rect x="20" y="48" width="560" height="42" rx="6" fill="#111827" stroke="#374151" stroke-width="1"/>
  <text x="36" y="74" font-family="sans-serif" font-size="14" font-weight="800" fill="#38bdf8">DEV<tspan fill="#a855f7">SPHERE</tspan></text>
  <rect x="180" y="56" width="220" height="26" rx="13" fill="#1f2937"/>
  <text x="210" y="73" font-family="sans-serif" font-size="11" fill="#6b7280">🔍 Search 10,000+ developer posts...</text>
  <rect x="470" y="56" width="95" height="26" rx="6" fill="#6366f1"/>
  <text x="517" y="73" font-family="sans-serif" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">+ Write Post</text>

  <!-- Feed Post 1 -->
  <g transform="translate(20, 102)">
    <rect width="560" height="125" rx="8" fill="#111827" stroke="#374151" stroke-width="1"/>
    
    <!-- Vote Counter -->
    <rect x="16" y="16" width="40" height="60" rx="6" fill="#1f2937"/>
    <text x="36" y="34" font-family="sans-serif" font-size="14" fill="#38bdf8" text-anchor="middle">▲</text>
    <text x="36" y="52" font-family="sans-serif" font-size="12" font-weight="bold" fill="#f9fafb" text-anchor="middle">382</text>
    <text x="36" y="68" font-family="sans-serif" font-size="14" fill="#6b7280" text-anchor="middle">▼</text>

    <!-- Post Info -->
    <circle cx="80" cy="28" r="12" fill="#6366f1"/>
    <text x="100" y="27" font-family="sans-serif" font-size="11" font-weight="600" fill="#f3f4f6">Elena Rostova</text>
    <text x="100" y="40" font-family="sans-serif" font-size="10" fill="#9ca3af">@erostova · 3h ago · 7 min read</text>

    <text x="70" y="66" font-family="sans-serif" font-size="14" font-weight="bold" fill="#f9fafb">Building Resilient Distributed Systems with Event Sourcing &amp; Go</text>
    <text x="70" y="86" font-family="sans-serif" font-size="11" fill="#9ca3af">A comprehensive deep-dive into event logs, idempotent consumers, and handling partition splits...</text>

    <!-- Tags -->
    <rect x="70" y="98" width="60" height="18" rx="4" fill="#374151"/>
    <text x="100" y="111" font-family="monospace" font-size="9" fill="#93c5fd" text-anchor="middle">#golang</text>
    <rect x="136" y="98" width="70" height="18" rx="4" fill="#374151"/>
    <text x="171" y="111" font-family="monospace" font-size="9" fill="#c4b5fd" text-anchor="middle">#distributed</text>
    <rect x="212" y="98" width="75" height="18" rx="4" fill="#374151"/>
    <text x="249" y="111" font-family="monospace" font-size="9" fill="#6ee7b7" text-anchor="middle">#architecture</text>
  </g>

  <!-- Feed Post 2 -->
  <g transform="translate(20, 238)">
    <rect width="560" height="125" rx="8" fill="#111827" stroke="#374151" stroke-width="1"/>
    
    <!-- Vote Counter -->
    <rect x="16" y="16" width="40" height="60" rx="6" fill="#1f2937"/>
    <text x="36" y="34" font-family="sans-serif" font-size="14" fill="#38bdf8" text-anchor="middle">▲</text>
    <text x="36" y="52" font-family="sans-serif" font-size="12" font-weight="bold" fill="#f9fafb" text-anchor="middle">219</text>
    <text x="36" y="68" font-family="sans-serif" font-size="14" fill="#6b7280" text-anchor="middle">▼</text>

    <!-- Post Info -->
    <circle cx="80" cy="28" r="12" fill="#10b981"/>
    <text x="100" y="27" font-family="sans-serif" font-size="11" font-weight="600" fill="#f3f4f6">Marcus Vance</text>
    <text x="100" y="40" font-family="sans-serif" font-size="10" fill="#9ca3af">@mvance · 5h ago · 4 min read</text>

    <text x="70" y="66" font-family="sans-serif" font-size="14" font-weight="bold" fill="#f9fafb">Mastering CSS Subgrid &amp; Container Queries in 2026</text>
    <text x="70" y="86" font-family="sans-serif" font-size="11" fill="#9ca3af">Why container queries eliminate media query bloat and make micro-components truly modular...</text>

    <rect x="70" y="98" width="55" height="18" rx="4" fill="#374151"/>
    <text x="97" y="111" font-family="monospace" font-size="9" fill="#f472b6" text-anchor="middle">#css3</text>
    <rect x="131" y="98" width="65" height="18" rx="4" fill="#374151"/>
    <text x="163" y="111" font-family="monospace" font-size="9" fill="#fde047" text-anchor="middle">#frontend</text>
  </g>
