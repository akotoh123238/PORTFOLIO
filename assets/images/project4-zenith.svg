<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="zBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070d19" />
      <stop offset="100%" stop-color="#0f2137" />
    </linearGradient>
    <linearGradient id="greenGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <rect width="600" height="380" rx="12" fill="url(#zBg)"/>
  
  <!-- Browser top bar -->
  <rect width="600" height="36" fill="#1e293b" rx="12"/>
  <rect y="24" width="600" height="12" fill="#1e293b"/>
  <circle cx="20" cy="18" r="5" fill="#ef4444" />
  <circle cx="36" cy="18" r="5" fill="#f59e0b" />
  <circle cx="52" cy="18" r="5" fill="#10b981" />
  <rect x="80" y="8" width="280" height="20" rx="6" fill="#0f172a" />
  <text x="95" y="22" font-family="monospace" font-size="11" fill="#94a3b8">https://zenith-vault.fi</text>

  <!-- Top Balance Card -->
  <g transform="translate(20, 50)">
    <rect width="560" height="90" rx="10" fill="#132338" stroke="#1e3a5f" stroke-width="1"/>
    <text x="24" y="32" font-family="sans-serif" font-size="12" fill="#94a3b8">Net Portfolio Balance</text>
    <text x="24" y="68" font-family="sans-serif" font-size="28" font-weight="bold" fill="#f8fafc">$248,930.15</text>
    <rect x="230" y="46" width="90" height="24" rx="12" fill="#10b981" fill-opacity="0.2"/>
    <text x="275" y="62" font-family="sans-serif" font-size="11" font-weight="bold" fill="#34d399" text-anchor="middle">+14.8% 24h</text>
    
    <!-- Mini Sparkline in header -->
    <path d="M400 65 Q430 40, 460 60 T520 30 T550 45" fill="none" stroke="#10b981" stroke-width="2.5"/>
  </g>

  <!-- Split View: Holdings Table on Left & Yield Distribution on Right -->
  <g transform="translate(20, 152)">
    <!-- Holdings -->
    <rect width="340" height="210" rx="8" fill="#0d1b2a" stroke="#1e3a5f" stroke-width="1"/>
    <text x="16" y="26" font-family="sans-serif" font-size="12" font-weight="bold" fill="#f8fafc">Assets &amp; Allocations</text>
    
    <!-- Row 1: BTC -->
    <g transform="translate(16, 42)">
      <circle cx="16" cy="16" r="14" fill="#f59e0b" fill-opacity="0.2"/>
      <text x="16" y="21" font-family="sans-serif" font-size="14" fill="#f59e0b" text-anchor="middle">₿</text>
      <text x="40" y="14" font-family="sans-serif" font-size="12" font-weight="bold" fill="#f8fafc">Bitcoin (BTC)</text>
      <text x="40" y="28" font-family="sans-serif" font-size="10" fill="#94a3b8">2.45 BTC</text>
      <text x="290" y="14" font-family="sans-serif" font-size="12" font-weight="bold" fill="#f8fafc" text-anchor="end">$147,200</text>
      <text x="290" y="28" font-family="sans-serif" font-size="10" fill="#10b981" text-anchor="end">+4.2%</text>
      <line x1="0" y1="38" x2="308" y2="38" stroke="#1e293b" stroke-width="1"/>
    </g>

    <!-- Row 2: ETH -->
    <g transform="translate(16, 92)">
      <circle cx="16" cy="16" r="14" fill="#6366f1" fill-opacity="0.2"/>
      <text x="16" y="21" font-family="sans-serif" font-size="14" fill="#818cf8" text-anchor="middle">Ξ</text>
      <text x="40" y="14" font-family="sans-serif" font-size="12" font-weight="bold" fill="#f8fafc">Ethereum (ETH)</text>
      <text x="40" y="28" font-family="sans-serif" font-size="10" fill="#94a3b8">21.8 ETH</text>
      <text x="290" y="14" font-family="sans-serif" font-size="12" font-weight="bold" fill="#f8fafc" text-anchor="end">$69,760</text>
      <text x="290" y="28" font-family="sans-serif" font-size="10" fill="#10b981" text-anchor="end">+6.8%</text>
      <line x1="0" y1="38" x2="308" y2="38" stroke="#1e293b" stroke-width="1"/>
    </g>

    <!-- Row 3: SOL -->
    <g transform="translate(16, 142)">
      <circle cx="16" cy="16" r="14" fill="#06b6d4" fill-opacity="0.2"/>
      <text x="16" y="21" font-family="sans-serif" font-size="12" fill="#22d3ee" text-anchor="middle">◎</text>
      <text x="40" y="14" font-family="sans-serif" font-size="12" font-weight="bold" fill="#f8fafc">Solana (SOL)</text>
      <text x="40" y="28" font-family="sans-serif" font-size="10" fill="#94a3b8">180 SOL</text>
      <text x="290" y="14" font-family="sans-serif" font-size="12" font-weight="bold" fill="#f8fafc" text-anchor="end">$31,970</text>
      <text x="290" y="28" font-family="sans-serif" font-size="10" fill="#10b981" text-anchor="end">+11.4%</text>
    </g>
  </g>

  <!-- Right: Yield Staking Card -->
  <g transform="translate(372, 152)">
    <rect width="208" height="210" rx="8" fill="#0d1b2a" stroke="#1e3a5f" stroke-width="1"/>
    <text x="16" y="26" font-family="sans-serif" font-size="12" font-weight="bold" fill="#f8fafc">Staking Yields</text>
    
    <!-- Doughnut Chart Mock -->
    <circle cx="104" cy="95" r="48" fill="none" stroke="#1e293b" stroke-width="14"/>
    <circle cx="104" cy="95" r="48" fill="none" stroke="#6366f1" stroke-width="14" stroke-dasharray="160 300" stroke-linecap="round"/>
    <circle cx="104" cy="95" r="48" fill="none" stroke="#06b6d4" stroke-width="14" stroke-dasharray="90 300" stroke-dashoffset="-165" stroke-linecap="round"/>
    <text x="104" y="94" font-family="sans-serif" font-size="14" font-weight="bold" fill="#f8fafc" text-anchor="middle">8.4%</text>
    <text x="104" y="108" font-family="sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">Avg APY</text>

    <!-- Legend -->
    <circle cx="28" cy="165" r="4" fill="#6366f1"/>
    <text x="40" y="169" font-family="sans-serif" font-size="10" fill="#cbd5e1">Ethereum 58%</text>
    <circle cx="28" cy="185" r="4" fill="#06b6d4"/>
    <text x="40" y="189" font-family="sans-serif" font-size="10" fill="#cbd5e1">Solana 42%</text>
  </g>
</svg>
